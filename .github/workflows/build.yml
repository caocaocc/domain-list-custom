name: Build geosite.dat
on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * *"
  push:
    branches:
      - master
    paths-ignore:
      - "**/README.md"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Compare latest tags and set variables
        run: |
          upstreamLatestTag=$(curl -sSL --connect-timeout 5 --retry 5 -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/v2fly/domain-list-community/releases/latest | grep "tag_name" | cut -d\" -f4)
          thisLatestTag=$(curl -sSL --connect-timeout 5 --retry 5 -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/${{ github.repository }}/releases/latest | grep "tag_name" | cut -d\" -f4)
          if [[ $upstreamLatestTag != $thisLatestTag ]]; then
            echo "NeedToSync=true" >> $GITHUB_ENV
          fi
          echo "RELEASE_NAME=$upstreamLatestTag" >> $GITHUB_ENV
          echo "TAG_NAME=$upstreamLatestTag" >> $GITHUB_ENV
        shell: bash

      - name: Checkout codebase
        uses: actions/checkout@v6
        if: ${{ env.NeedToSync }}

      - name: Setup Go
        uses: actions/setup-go@v6
        if: ${{ env.NeedToSync }}
        with:
          go-version-file: ./go.mod

      - name: Checkout v2fly/domain-list-community
        if: ${{ env.NeedToSync }}
        uses: actions/checkout@v6
        with:
          repository: v2fly/domain-list-community
          path: domain-list-community

      - name: Add domain list
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          SOURCES = {
              "cdn": [
                  "https://raw.githubusercontent.com/SukkaLab/ruleset.skk.moe/master/sing-box/domainset/cdn.json",
                  "https://raw.githubusercontent.com/SukkaLab/ruleset.skk.moe/master/sing-box/non_ip/cdn.json",
              ],
              "stream": [
                  "https://raw.githubusercontent.com/SukkaLab/ruleset.skk.moe/master/sing-box/non_ip/stream.json",
              ],
              "ai": [
                  "https://raw.githubusercontent.com/SukkaLab/ruleset.skk.moe/master/sing-box/non_ip/ai.json",
              ],
              "global": [
                  "https://raw.githubusercontent.com/SukkaLab/ruleset.skk.moe/master/sing-box/non_ip/global.json",
              ],
              "domestic": [
                  "https://raw.githubusercontent.com/SukkaLab/ruleset.skk.moe/master/sing-box/non_ip/domestic.json",
              ],
          }
          DOMAIN_RE = re.compile(r"^[a-z0-9.-]+$")

          def fetch_json(url: str) -> dict:
              with urllib.request.urlopen(url) as response:
                  return json.load(response)

          def normalize_domain(value: str, strip_dot: bool):
              value = value.strip().lower()
              if strip_dot:
                  value = value.lstrip(".").rstrip(".")
              if not value:
                  return None
              if not DOMAIN_RE.match(value):
                  return None
              return value

          def build_lines(urls):
              lines = set()
              for url in urls:
                  payload = fetch_json(url)
                  for rule in payload.get("rules", []):
                      for item in rule.get("domain_suffix", []):
                          value = normalize_domain(item, strip_dot=True)
                          if value:
                              lines.add("domain:" + value)
                      for item in rule.get("domain", []):
                          value = normalize_domain(item, strip_dot=True)
                          if value:
                              lines.add("full:" + value)
                      for item in rule.get("domain_keyword", []):
                          value = normalize_domain(item, strip_dot=False)
                          if value:
                              lines.add("keyword:" + value)
                      for item in rule.get("domain_regex", []):
                          value = str(item).strip()
                          if value:
                              lines.add("regexp:" + value)
              return lines

          for name, urls in SOURCES.items():
              lines = build_lines(urls)
              header = ["# Generated from:"]
              header.extend("# - " + url for url in urls)
              header.append("")
              output_path = f"domain-list-community/data/{name}"
              os.makedirs(os.path.dirname(output_path), exist_ok=True)
              with open(output_path, "w", encoding="utf-8") as f:
                  f.write("\n".join(header + sorted(lines)))
                  f.write("\n")
          PY

      - name: Append attribute rules
        if: ${{ env.NeedToSync }}
        run: |
          echo "include:geolocation-!cn @cn" >> ./domain-list-community/data/cn
          echo "include:geolocation-cn @!cn" >> ./domain-list-community/data/geolocation-\!cn
          echo "missav.live" >> ./domain-list-community/data/missav

      - name: Get dependencies and run
        if: ${{ env.NeedToSync }}
        run: |
          go run ./ --datapath=./domain-list-community/data

      - name: Generate sha256 hashsum
        if: ${{ env.NeedToSync }}
        run: |
          cd publish || exit 1
          sha256sum geosite.dat > geosite.dat.sha256sum

      - name: Git push assets to "release" branch
        if: ${{ env.NeedToSync }}
        run: |
          cd publish || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "${{ env.RELEASE_NAME }}"
          git remote add publish "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f publish release

      - name: Release and upload assets
        if: ${{ env.NeedToSync }}
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          files: |
            ./publish/geosite.dat
            ./publish/geosite.dat.sha256sum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
